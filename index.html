<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2729762064102548"
     crossorigin="anonymous"></script>

    <style>
        /* --- Front Page Custom Styling --- */
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(41, 246, 205); /* Your original background color */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Front Page UI Container */
        .ui-container {
            text-align: center;
            z-index: 10; /* Keeps text and button above the hidden canvas */
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #000;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #000;
        }

        /* Start Button Styling */
        .start-btn {
            padding: 12px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background-color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* --- Back Button Styling (Initially Hidden) --- */
        .back-btn {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background-color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 5px;
            cursor: pointer;
            z-index: 20; /* Keeps it above the game canvas */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background-color: transparent;
            color: #ffffff;
        }

        /* --- Game Canvas Styling --- */
        canvas {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="ui-container" id="welcomeScreen">
        <h1>Welcome</h1>
        <p>here amzing content</p>
        <button class="start-btn" id="startBtn">start</button>
    </div>

    <button class="back-btn" id="backBtn">Back</button>

    <canvas id="reptileCanvas"></canvas>

    <script>
        const welcomeScreen = document.getElementById('welcomeScreen');
        const startBtn = document.getElementById('startBtn');
        const backBtn = document.getElementById('backBtn');
        const canvas = document.getElementById('reptileCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let animationFrameId = null; 
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        // --- Start Button Click Handler ---
        startBtn.addEventListener('click', () => {
            welcomeScreen.style.display = 'none';
            document.body.style.backgroundColor = '#05070f';
            canvas.style.display = 'block';
            backBtn.style.display = 'block';
            gameStarted = true;
            
            mouse.x = window.innerWidth / 2;
            mouse.y = window.innerHeight / 2;

            for (let i = 0; i < numSegments; i++) {
                spine[i].x = mouse.x;
                spine[i].y = mouse.y;
            }
            
            resizeCanvas();
            animate();
        });

        // --- Back Button Click Handler ---
        backBtn.addEventListener('click', () => {
            gameStarted = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            canvas.style.display = 'none';
            backBtn.style.display = 'none';
            document.body.style.backgroundColor = 'rgb(41, 246, 205)';
            welcomeScreen.style.display = 'block';
        });

        // --- ORIGINAL REPTILE GAME ENGINE ---
        function resizeCanvas() {
            if (!gameStarted) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        const numSegments = 55;        
        const segmentLength = 7;       
        const spine = [];

        for (let i = 0; i < numSegments; i++) {
            spine.push({ x: mouse.x, y: mouse.y, angle: 0 });
        }

        const legConfigs = [];
        const startSegment = 5;        
        const segmentGap = 4;          

        for (let i = 0; i < 10; i++) {
            const bodyIdx = startSegment + (i * segmentGap);
            legConfigs.push({ bodyIndex: bodyIdx, side: -1, pairIndex: i }); 
            legConfigs.push({ bodyIndex: bodyIdx, side: 1,  pairIndex: i });  
        }

        class Leg {
            constructor(bodyIndex, side, pairIndex) {
                this.bodyIndex = bodyIndex; 
                this.side = side;       
                this.pairIndex = pairIndex;
                
                this.footX = spine[bodyIndex].x;
                this.footY = spine[bodyIndex].y;
                this.targetX = this.footX;
                this.targetY = this.footY;
                
                this.stepProgress = 1; 
                this.stepSpeed = 0.35;  
            }

            update(time) {
                const baseSegment = spine[this.bodyIndex];
                const jointAngle = baseSegment.angle + (Math.PI / 2 * this.side) + (Math.PI / 8);
                const jointX = baseSegment.x + Math.cos(jointAngle) * 5;
                const jointY = baseSegment.y + Math.sin(jointAngle) * 5;

                const footAngle = baseSegment.angle + (Math.PI / 2.2 * this.side) + (Math.PI / 5);
                const idealFootX = jointX + Math.cos(footAngle) * 20;
                const idealFootY = jointY + Math.sin(footAngle) * 20;

                const dx = idealFootX - this.footX;
                const dy = idealFootY - this.footY;
                const distFromIdeal = Math.sqrt(dx * dx + dy * dy);

                const legWaveOffset = (this.pairIndex * 0.5) + (this.side === 1 ? Math.PI : 0);
                const canStep = Math.sin(time * 0.02 + legWaveOffset) > 0;

                if (distFromIdeal > 14 && this.stepProgress >= 1 && canStep) {
                    this.targetX = idealFootX + Math.cos(baseSegment.angle) * 6; 
                    this.targetY = idealFootY + Math.sin(baseSegment.angle) * 6;
                    this.stepProgress = 0; 
                }

                if (this.stepProgress < 1) {
                    this.stepProgress += this.stepSpeed;
                    if (this.stepProgress > 1) this.stepProgress = 1;

                    this.footX += (this.targetX - this.footX) * this.stepProgress;
                    this.footY += (this.targetY - this.footY) * this.stepProgress;
                }

                this.drawLeg(jointX, jointY);
            }

            drawLeg(jointX, jointY) {
                const dx = this.footX - jointX;
                const dy = this.footY - jointY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const upperArmLen = 11;
                const lowerArmLen = 11;

                let bendAngle = Math.atan2(dy, dx) - (Math.PI / 3 * this.side);
                if (dist < upperArmLen + lowerArmLen) {
                    bendAngle = Math.atan2(dy, dx) - Math.acos((dist*dist + upperArmLen*upperArmLen - lowerArmLen*lowerArmLen) / (2 * dist * upperArmLen)) * this.side;
                }

                const kneeX = jointX + Math.cos(bendAngle) * upperArmLen;
                const kneeY = jointY + Math.sin(bendAngle) * upperArmLen;

                ctx.beginPath();
                ctx.moveTo(jointX, jointY);
                ctx.lineTo(kneeX, kneeY);
                ctx.lineTo(this.footX, this.footY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.footX, this.footY, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        const legs = legConfigs.map(cfg => new Leg(cfg.bodyIndex, cfg.side, cfg.pairIndex));

        // --- ANIMATION LOOP ---
        let frameCount = 0;
        function animate() {
            if (!gameStarted) return; 

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            const head = spine[0];
            head.x += (mouse.x - head.x) * 0.12;
            head.y += (mouse.y - head.y) * 0.12;

            for (let i = 1; i < numSegments; i++) {
                const prev = spine[i - 1];
                const curr = spine[i];

                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                curr.angle = Math.atan2(dy, dx);

                const targetX = prev.x - Math.cos(curr.angle) * segmentLength;
                const targetY = prev.y - Math.sin(curr.angle) * segmentLength;

                curr.x += (targetX - curr.x) * 0.65;
                curr.y += (targetY - curr.y) * 0.65;
            }

            legs.forEach(leg => leg.update(frameCount * 10));

            ctx.beginPath();
            ctx.moveTo(spine[0].x, spine[0].y);
            for (let i = 1; i < numSegments; i++) {
                ctx.lineTo(spine[i].x, spine[i].y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Original Swept-back Ribs Animation
            for (let i = 2; i < numSegments - 2; i++) {
                const seg = spine[i];
                let ribLength = Math.max(1.5, 15 * (1 - (i / numSegments))); 

                const leftCurveAngle = seg.angle + Math.PI/2 + (Math.PI / 4.5);  
                const rightCurveAngle = seg.angle - Math.PI/2 - (Math.PI / 4.5);

                const lx = seg.x + Math.cos(leftCurveAngle) * ribLength;
                const ly = seg.y + Math.sin(leftCurveAngle) * ribLength;
                
                const rx = seg.x + Math.cos(rightCurveAngle) * ribLength;
                const ry = seg.y + Math.sin(rightCurveAngle) * ribLength;

                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(seg.x, seg.y);
                ctx.lineTo(rx, ry);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.1;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(spine[0].x, spine[0].y, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            animationFrameId = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
